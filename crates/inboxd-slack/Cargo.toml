[package]
name = "inboxd-slack"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["io-std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls", "json", "stream"] }
tokio-tungstenite = { version = "=0.28.0", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
# Keep URL normalization compatible with the workspace's Rust 1.85 toolchain.
idna_adapter = "=1.2.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "=3.19.1"

[[bin]]
name = "inboxd-slack-native"
path = "src/main.rs"
