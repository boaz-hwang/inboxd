[package]
name = "inboxd-storage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
inboxd-core = { path = "../inboxd-core" }
serde_json.workspace = true
rusqlite = { version = "=0.40.2", default-features = false, features = ["sqlcipher"] }
ryu-js = "=1.0.2"
sha2 = "0.10"
base64.workspace = true
fs2 = "0.4"
libc.workspace = true
getrandom = "=0.3.4"
uuid = { version = "=1.16.0", features = ["v4"] }
zeroize = "=1.8.1"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "=3.19.1"
static_assertions = "=1.1.0"
