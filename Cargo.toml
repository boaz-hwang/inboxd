[workspace]
members = [
  "crates/inboxd-core",
  "crates/inboxd-storage",
  "crates/inboxd-protocol",
  "crates/inboxd-daemon",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
libc = "=0.2.189"
rustix = { version = "=1.1.5", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "=1.16.0", features = ["v4"] }
zeroize = "=1.8.1"
